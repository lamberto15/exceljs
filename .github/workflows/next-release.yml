name: next-release

# Manual trigger only (Actions > next-release > Run workflow), so nothing reaches npm by accident:
#  - pending changesets (next/.changeset/*.md)  -> opens/updates the "Version Packages" PR
#  - no pending changesets, version not on npm  -> builds, tests and publishes with provenance
# Publishing uses npm trusted publishing (OIDC): no token secret; the package must already exist on
# npm and have this workflow (next-release.yml) registered as its trusted publisher. Provenance is
# attached automatically. See next/RELEASING.md. To automate later, add:
#   push: { branches: [next], paths: ['next/**'] }

on:
  workflow_dispatch:

concurrency:
  group: next-release
  cancel-in-progress: false

permissions:
  contents: write # push the version branch, create tags/releases
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing + provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: next/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: Install
        working-directory: next
        run: pnpm install --frozen-lockfile
      - name: Verify
        working-directory: next
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm size
      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          cwd: next
          # Publishes with the npm CLI over OIDC when the version is not on npm yet, then tags.
          publish: node scripts/publish-if-new.mjs
          version: pnpm changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
