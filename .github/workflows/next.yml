name: next

on:
  push:
    branches: [next]
    paths: ['next/**', '.github/workflows/next.yml']
  pull_request:
    paths: ['next/**', '.github/workflows/next.yml']

defaults:
  run:
    working-directory: next

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # macOS runners are scarce (free plan: max 5 concurrent) and turbosheet is pure JS, so
        # one macOS job (newest Node) is enough; Linux and Windows run both Node versions.
        exclude:
          - node: 22
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: next/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: next/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm size
      - name: LibreOffice opens generated files
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
          node test/smoke/generate.mjs out
          node test/smoke/excel-pack.mjs out/pack
          rm out/pack/*encrypted*.xlsx
          for f in out/*.xlsx out/pack/*.xlsx; do soffice --headless --convert-to csv --outdir out/csv "$f"; done
          test "$(ls out/csv | wc -l)" -eq "$(ls out/*.xlsx out/pack/*.xlsx | wc -l)"
